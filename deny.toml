# cargo-deny policy for Glossa supply-chain checks.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

[advisories]
yanked = "warn"
# Ignore unused advisory ids deliberately with rationale in PRs, not empty defaults.
ignore = [
    # ttf-parser is unmaintained (no known vulnerability). It is pulled in
    # transitively by pdf-extract for font metrics; no maintained pdf-extract
    # release drops it yet. Revisit when pdf-extract migrates to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained transitive dep of pdf-extract; no vulnerability" },
    # paste is archived (no known vulnerability); pulled in by ratatui.
    # Revisit when ratatui drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained transitive dep of ratatui; no vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
