[workspace]
resolver = "2"
members = [
    "crates/glossa-cli",
    "crates/glossa-core",
    "crates/glossa-io",
    "crates/glossa-index",
    "crates/glossa-workspace",
    "crates/glossa-tui",
    "crates/glossa-nlp",
    "crates/glossa-stats",
    "crates/glossa-plugin",
]
default-members = ["crates/glossa-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/glossa-tools/glossa"
homepage = "https://glossa.tools"
authors = ["Glossa contributors"]
description = "Offline-first linguistics CLI/TUI"

[workspace.dependencies]
glossa-core = { path = "crates/glossa-core", version = "0.1.0" }
glossa-io = { path = "crates/glossa-io", version = "0.1.0" }
glossa-index = { path = "crates/glossa-index", version = "0.1.0" }
glossa-workspace = { path = "crates/glossa-workspace", version = "0.1.0" }
glossa-nlp = { path = "crates/glossa-nlp", version = "0.1.0" }
glossa-tui = { path = "crates/glossa-tui", version = "0.1.0" }
glossa-stats = { path = "crates/glossa-stats", version = "0.1.0" }
glossa-plugin = { path = "crates/glossa-plugin", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
sha2 = "0.11"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
fst = "0.4"
memmap2 = "0.9"
byteorder = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
chardetng = "1.0"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
pdf-extract = "0.12"
csv = "1"
regex = "1"
tempfile = "3"
proptest = "1"
insta = { version = "1", features = ["json", "yaml"] }
criterion = { version = "0.8", features = ["html_reports"] }
walkdir = "2"
indexmap = { version = "2", features = ["serde"] }

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
install-updater = false
pr-run-mode = "plan"
