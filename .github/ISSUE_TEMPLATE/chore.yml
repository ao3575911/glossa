name: Chore / maintenance
description: Tooling, labels, CI, repo hygiene (not a user-facing feature).
title: "[chore] "
labels: ["type:chore", "status:triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ci
        - docs
        - security
        - brand
        - dependencies
        - repository settings
        - other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
